<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.url == '/' %}{{ site.title }} | {{ site.tagline }}{% elsif page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} | {{ site.tagline }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
<link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
<meta property="og:type" content="website">
<meta property="og:title" content="{% if page.url == '/' %}{{ site.title }} | {{ site.tagline }}{% else %}{{ page.title | default: site.title }} | {{ site.title }}{% endif %}">
<meta property="og:description" content="{{ page.description | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
<meta property="og:url" content="{{ page.url | replace: 'index.html', '' | absolute_url }}">
{% if page.url == '/' %}<meta property="og:image" content="{{ '/assets/images/statue-walk.jpg' | absolute_url }}">{% endif %}
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}: Reflections" href="{{ '/reflections/feed.xml' | absolute_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v=mobile-gutters-20261111">
<link rel="icon" href="{{ '/assets/images/favicon.ico' | relative_url }}" sizes="any">
<link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
