---
layout: default
---
<div class="wrap">
  <div class="page-header">
    <p class="eyebrow"><a href="{{ '/reflections/' | relative_url }}">&larr; All Reflections</a></p>
    <h1>{{ page.title }}</h1>
    {% assign formatted_date = page.date | date: "%B %-d, %Y" %}
    {% if page.title != formatted_date %}
    <p class="lede" style="margin-bottom:0">{{ formatted_date }}</p>
    {% endif %}
  </div>
</div>

<div class="section wrap">
  {% include photo-gallery.html photo=page.photo photos=page.photos title=page.title %}
  <div style="max-width:70ch;font-size:17px;line-height:1.75;color:var(--ink-soft)">
    {{ content }}
  </div>
</div>
