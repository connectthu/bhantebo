backend:
  name: github
  repo: connectthu/bhantebo
  branch: main
  base_url: https://bhantebo-cms-auth.bhantebo.workers.dev
  auth_endpoint: auth

# Files uploaded through the CMS (photos, etc.) land in /assets/images in
# the repo. public_folder's value is written VERBATIM into each entry's
# saved photo path — keep it root-relative (matches Jekyll's relative_url
# output at baseurl: "").
media_folder: "assets/images"
public_folder: "/assets/images"

publish_mode: simple
site_url: https://bhantebo.com
display_url: https://bhantebo.com
logo_url: /assets/images/monk-path-buddha.jpg

collections:
  - name: "reflections"
    label: "Reflections"
    label_singular: "Reflection"
    description: "Daily photo + reflection posts from the training walk."
    folder: "_reflections"
    create: true
    delete: true
    # Filename is always just the date, regardless of title — keeps every
    # reflection's file/URL short no matter what's typed in Title.
    slug: "{{year}}-{{month}}-{{day}}"
    identifier_field: title
    summary: "{{date}} — {{title}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "A short line — the date works well on its own (e.g. \"August 20, 2026\"), or add a brief phrase like \"Day 41 — One Million Steps.\" Put the full reflection in the field below.", pattern: ["^.{1,80}$", "Please keep the title under 80 characters."] }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: true, time_format: false, picker_utc: true }
      - { label: "Photo", name: "photo", widget: "image", media_library: { config: { multiple: false } } }
      - { label: "Reflection", name: "body", widget: "markdown" }

  - name: "events"
    label: "Events"
    label_singular: "Event"
    description: "Upcoming in-person events."
    folder: "_events"
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: title
    summary: "{{date}} — {{title}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Title", name: "title", widget: "string", pattern: ["^.{1,80}$", "Please keep the title under 80 characters."] }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: true, time_format: false, picker_utc: true }
      - { label: "Time", name: "time", widget: "string", hint: "e.g. 10:00 AM – 2:00 PM · Location" }
      - { label: "Learn More Link", name: "link", widget: "string", required: false }
