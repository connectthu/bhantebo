backend:
  name: github
  repo: connectthu/bhantebo
  branch: main
  base_url: https://bhantebo-cms-auth.bhantebo.workers.dev
  auth_endpoint: auth

# Files uploaded through the CMS (photos, etc.) land in /assets/images in
# the repo. public_folder's value is written VERBATIM into each entry's
# saved photo path — it is content, not just a preview hint — so it must
# stay the portable, root-relative path here regardless of which domain
# is currently serving the site. Jekyll's `relative_url` filter is what
# adds the /bhantebo prefix at render time (see _config.yml's baseurl).
#
# ⚠️ Do NOT prefix this with /bhantebo, even temporarily: doing so once
# already caused saved photo paths to render doubled
# (/bhantebo/bhantebo/assets/...) once relative_url added the prefix a
# second time on top. The one accepted cost of keeping this correct: the
# CMS editor's own thumbnail preview looks broken while editing (it
# requests the image root-relative to connectthu.github.io, not
# .../bhantebo/), even though the published site renders it correctly.
# That preview-only issue resolves itself once bhantebo.com's DNS is
# live and _config.yml's baseurl goes back to "" (see "Deferred custom
# domain" note in _config.yml / memory) — nothing here will need to
# change at that point.
media_folder: "assets/images"
public_folder: "/assets/images"

publish_mode: simple
# ⚠️ TEMPORARY: pointed at the github.io preview until bhantebo.com's DNS
# is live. Change these back to https://bhantebo.com then.
site_url: https://connectthu.github.io/bhantebo/
display_url: https://connectthu.github.io/bhantebo/
logo_url: /bhantebo/assets/images/monk-path-buddha.jpg

collections:
  - name: "reflections"
    label: "Reflections"
    label_singular: "Reflection"
    description: "Daily photo + reflection posts from the training walk."
    folder: "_reflections"
    create: true
    delete: true
    # Filename is always just the date, regardless of title — keeps every
    # reflection's file/URL short no matter what's typed in Title.
    slug: "{{year}}-{{month}}-{{day}}"
    identifier_field: title
    summary: "{{date}} — {{title}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "A short line — the date works well on its own (e.g. \"August 20, 2026\"), or add a brief phrase like \"Day 41 — One Million Steps.\" Put the full reflection in the field below.", pattern: ["^.{1,80}$", "Please keep the title under 80 characters."] }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: true, time_format: false, picker_utc: true }
      - { label: "Photo", name: "photo", widget: "image", media_library: { config: { multiple: false } } }
      - { label: "Reflection", name: "body", widget: "markdown" }

  - name: "events"
    label: "Events"
    label_singular: "Event"
    description: "Upcoming in-person events."
    folder: "_events"
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: title
    summary: "{{date}} — {{title}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Title", name: "title", widget: "string", pattern: ["^.{1,80}$", "Please keep the title under 80 characters."] }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: true, time_format: false, picker_utc: true }
      - { label: "Time", name: "time", widget: "string", hint: "e.g. 10:00 AM – 2:00 PM · Location" }
      - { label: "Learn More Link", name: "link", widget: "string", required: false }
