<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Post a Reflection</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#B6510F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Post">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="../assets/images/icon-192.png">
<link rel="icon" href="../assets/images/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Lora:ital,wght@0,400;0,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6EFE3; --ink:#241C15; --ink-soft:#4A3E32; --ink-mute:#6B5D4F; --ink-faint:#8A7B6A;
    --card:#FFFCF6; --border:rgba(36,28,21,0.12); --accent:#B6510F; --accent-hover:#8C3D0A;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink-soft); font-family:'Lora',serif;
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
    padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);
    display:flex; flex-direction:column;
  }
  .screen{ flex:1; display:flex; flex-direction:column; min-height:100vh; }
  .hidden{ display:none !important; }

  /* ---------- Login screen ---------- */
  #login-screen{ align-items:center; justify-content:center; text-align:center; padding:32px; gap:18px; }
  #login-screen .brand{ font-family:'Oswald',sans-serif; font-weight:700; font-size:15px; letter-spacing:0.08em; color:var(--ink); text-transform:uppercase; }
  #login-screen h1{ font-family:'Oswald',sans-serif; font-weight:700; font-size:28px; color:var(--ink); margin:0; }
  #login-screen p{ font-size:15.5px; line-height:1.6; color:var(--ink-mute); max-width:32ch; margin:0; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    font-family:system-ui,sans-serif; font-weight:600; font-size:16px;
    padding:15px 28px; border-radius:10px; border:none; cursor:pointer;
    background:var(--accent); color:#FFF9F0; min-height:50px;
  }
  .btn:active{ background:var(--accent-hover); }
  .btn:disabled{ opacity:0.55; }
  .btn-block{ width:100%; }

  /* ---------- Composer screen ---------- */
  #composer-screen{ padding:0; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; border-bottom:1px solid var(--border);
  }
  .topbar .who{ font-family:system-ui,sans-serif; font-size:13px; color:var(--ink-faint); }
  .topbar .who b{ color:var(--ink-soft); }
  .topbar a, .topbar button.link{
    font-family:system-ui,sans-serif; font-size:13px; color:var(--ink-faint);
    background:none; border:none; padding:6px; cursor:pointer;
  }
  .composer-body{ flex:1; display:flex; flex-direction:column; padding:16px; gap:14px; overflow-y:auto; }

  .photo-tile{
    width:100%; aspect-ratio:4/3; border-radius:14px; border:2px dashed var(--border);
    background:var(--card); display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px; cursor:pointer; overflow:hidden; position:relative; color:var(--ink-faint);
  }
  .photo-tile.has-photo{ border-style:solid; border-color:var(--border); }
  .photo-tile img{ width:100%; height:100%; object-fit:cover; }
  .photo-tile .plus{ font-size:34px; line-height:1; color:var(--accent); }
  .photo-tile .label{ font-family:system-ui,sans-serif; font-size:14px; font-weight:600; }
  .photo-tile .remove{
    position:absolute; top:10px; right:10px; width:32px; height:32px; border-radius:50%;
    background:rgba(36,28,21,0.65); color:#fff; border:none; font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  #photo-input{ display:none; }

  #body-text{
    flex:0 0 auto; min-height:160px; width:100%; resize:none; border:none; background:transparent;
    font-family:'Lora',serif; font-size:17px; line-height:1.6; color:var(--ink); padding:4px 2px;
    overflow:hidden; /* height is driven by JS auto-grow, not a scrollbar */
  }
  #body-text:focus{ outline:none; }
  #body-text::placeholder{ color:var(--ink-faint); }

  .composer-footer{ padding:14px 16px; border-top:1px solid var(--border); }
  .status{ font-family:system-ui,sans-serif; font-size:13.5px; text-align:center; margin:0 0 10px; min-height:0; }
  .status.error{ color:#B02A2A; }
  .status.ok{ color:#2E6B3E; }

  /* ---------- List screen ---------- */
  .list-body{ flex:1; overflow-y:auto; padding:0 16px 16px; }
  .list-row{
    display:flex; align-items:center; gap:12px; padding:12px 0;
    border-bottom:1px solid var(--border); cursor:pointer;
  }
  .list-row .thumb{
    width:52px; height:52px; border-radius:8px; object-fit:cover; flex-shrink:0;
    background:var(--card); border:1px solid var(--border);
  }
  .list-row .thumb.placeholder{ display:flex; align-items:center; justify-content:center; font-size:20px; }
  .list-row .info{ flex:1; min-width:0; }
  .list-row .date{ font-family:system-ui,sans-serif; font-size:12.5px; font-weight:600; color:var(--accent); }
  .list-row .snippet{
    font-size:14.5px; color:var(--ink-soft); margin-top:2px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .list-row .del-btn{
    flex-shrink:0; width:32px; height:32px; border-radius:50%; border:none;
    background:transparent; color:var(--ink-faint); font-size:20px; cursor:pointer;
  }
  .list-row .del-btn:active{ background:var(--border); }

  /* ---------- Success screen ---------- */
  #success-screen{ align-items:center; justify-content:center; text-align:center; padding:32px; gap:16px; }
  #success-screen .check{ font-size:52px; }
  #success-screen h1{ font-family:'Oswald',sans-serif; font-weight:700; font-size:24px; color:var(--ink); margin:0; }
  #success-screen a{ color:var(--accent); font-family:system-ui,sans-serif; font-size:14px; }

  .spinner{
    width:16px; height:16px; border-radius:50%; border:2px solid rgba(255,249,240,0.5);
    border-top-color:#FFF9F0; animation:spin 0.7s linear infinite; display:inline-block;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>

<div id="login-screen" class="screen">
  <div class="brand">Bhante Bodhicitta</div>
  <h1>Post a Reflection</h1>
  <p>Sign in with the GitHub account you use for the site to post a quick photo + reflection.</p>
  <button id="login-btn" class="btn">Sign in with GitHub</button>
  <p id="login-error" class="status error hidden"></p>
</div>

<div id="composer-screen" class="screen hidden">
  <div class="topbar">
    <span class="who" id="topbar-context">Posting as <b id="who-name">…</b></span>
    <span id="topbar-actions"></span>
  </div>
  <div class="composer-body">
    <div id="photo-tile" class="photo-tile">
      <span class="plus">+</span>
      <span class="label">Add Photo</span>
    </div>
    <input id="photo-input" type="file" accept="image/*">
    <textarea id="body-text" placeholder="Share today's reflection…"></textarea>
  </div>
  <div class="composer-footer">
    <p id="post-status" class="status hidden"></p>
    <button id="post-btn" class="btn btn-block">Post</button>
  </div>
</div>

<div id="success-screen" class="screen hidden">
  <div class="check">🙏</div>
  <h1>Posted</h1>
  <a id="success-link" href="#" target="_blank" rel="noopener">See all reflections →</a>
  <button id="post-another-btn" class="btn" style="margin-top:8px">Post Another</button>
</div>

<div id="list-screen" class="screen hidden">
  <div class="topbar">
    <span class="who">My Posts</span>
    <button class="link" id="new-post-btn">+ New</button>
  </div>
  <div id="list-body" class="list-body">
    <p id="list-status" class="status hidden" style="margin-top:16px"></p>
    <div id="list-items"></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // Must match admin/config.yml's backend.base_url — same Worker, same
  // OAuth App, same repo. If you redeploy the Worker, update both places.
  var WORKER_BASE_URL = "https://bhantebo-cms-auth.bhantebo.workers.dev";
  var GITHUB_OWNER = "connectthu";
  var GITHUB_REPO = "bhantebo";
  var GITHUB_BRANCH = "main";
  var TOKEN_KEY = "bhantebo_post_token";
  var DRAFT_KEY = "bhantebo_post_draft";

  var els = {};
  ["login-screen","composer-screen","success-screen","list-screen","login-btn","login-error",
   "topbar-context","topbar-actions","photo-tile","photo-input","body-text","post-btn",
   "post-status","success-link","post-another-btn","new-post-btn","list-body","list-status",
   "list-items"].forEach(function (id) {
    els[id] = document.getElementById(id);
  });

  function showScreen(name) {
    ["login-screen","composer-screen","success-screen","list-screen"].forEach(function (s) {
      els[s].classList.toggle("hidden", s !== name);
    });
  }

  function setStatus(el, text, kind) {
    el.textContent = text || "";
    el.classList.remove("error", "ok");
    if (kind) el.classList.add(kind);
    el.classList.toggle("hidden", !text);
  }

  // ---------------- Auth (same postMessage handshake as Decap CMS) ----------------

  function login() {
    return new Promise(function (resolve, reject) {
      var width = 600, height = 700;
      var left = window.screenX + Math.max(0, (window.outerWidth - width) / 2);
      var top = window.screenY + Math.max(0, (window.outerHeight - height) / 2);
      var popup = window.open(
        WORKER_BASE_URL + "/auth",
        "github-oauth",
        "width=" + width + ",height=" + height + ",left=" + left + ",top=" + top
      );
      if (!popup) {
        reject(new Error("Popup was blocked — please allow popups for this site and try again."));
        return;
      }
      var workerOrigin = new URL(WORKER_BASE_URL).origin;

      function onMessage(e) {
        if (e.origin !== workerOrigin) return; // only trust our own Worker
        var data = e.data;
        if (data === "authorizing:github") {
          // Echo back so the popup can capture our origin as the safe
          // target for the real token (mirrors the Worker's handshake).
          popup.postMessage("authorizing:github", workerOrigin);
          return;
        }
        var match = /^authorization:github:(success|error):(.+)$/.exec(data);
        if (!match) return;
        window.removeEventListener("message", onMessage);
        var payload;
        try { payload = JSON.parse(match[2]); } catch (err) { payload = {}; }
        if (match[1] === "success") {
          resolve(payload.token);
        } else {
          reject(new Error(payload.message || "GitHub login failed."));
        }
      }
      window.addEventListener("message", onMessage);
    });
  }

  function getToken() { return localStorage.getItem(TOKEN_KEY); }
  function saveToken(t) { localStorage.setItem(TOKEN_KEY, t); }
  function clearToken() { localStorage.removeItem(TOKEN_KEY); }

  function ghFetch(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({
      "Authorization": "token " + getToken(),
      "Accept": "application/vnd.github+json"
    }, opts.headers || {});
    return fetch("https://api.github.com" + path, opts);
  }

  function whoAmI() {
    return ghFetch("/user").then(function (r) {
      if (!r.ok) throw new Error("unauthorized");
      return r.json();
    });
  }

  // ---------------- Photo handling ----------------

  var photoBlob = null;        // compressed JPEG Blob for a newly-picked photo, or null
  var existingPhotoPath = null; // raw front-matter photo path when editing, e.g. "/assets/images/x.jpg"

  function resizeAndCompress(file) {
    if (typeof createImageBitmap !== "function") return Promise.resolve(file);
    return createImageBitmap(file, { imageOrientation: "from-image" }).then(function (bitmap) {
      var maxDim = 1600;
      var scale = Math.min(1, maxDim / Math.max(bitmap.width, bitmap.height));
      var w = Math.round(bitmap.width * scale);
      var h = Math.round(bitmap.height * scale);
      var canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext("2d");
      ctx.drawImage(bitmap, 0, 0, w, h);
      return new Promise(function (resolve, reject) {
        canvas.toBlob(function (blob) { blob ? resolve(blob) : reject(new Error("toBlob failed")); }, "image/jpeg", 0.85);
      });
    }).catch(function () {
      // Fall back to the original file untouched rather than blocking the post.
      return file;
    });
  }

  function rawUrl(repoPath) {
    // repoPath like "/assets/images/x.jpg" (leading slash) -> raw.githubusercontent.com URL.
    // Works unauthenticated since the repo is public.
    return "https://raw.githubusercontent.com/" + GITHUB_OWNER + "/" + GITHUB_REPO + "/" +
      GITHUB_BRANCH + "/" + repoPath.replace(/^\//, "");
  }

  function renderPhotoTile() {
    var tile = els["photo-tile"];
    var previewSrc = photoBlob ? URL.createObjectURL(photoBlob) : (existingPhotoPath ? rawUrl(existingPhotoPath) : null);
    if (previewSrc) {
      tile.classList.add("has-photo");
      tile.innerHTML = '<img src="' + previewSrc + '" alt="Selected photo">' +
        '<button type="button" class="remove" id="remove-photo-btn" aria-label="Remove photo">×</button>';
      document.getElementById("remove-photo-btn").addEventListener("click", function (e) {
        e.stopPropagation();
        photoBlob = null;
        existingPhotoPath = null;
        renderPhotoTile();
      });
    } else {
      tile.classList.remove("has-photo");
      tile.innerHTML = '<span class="plus">+</span><span class="label">Add Photo</span>';
    }
  }

  els["photo-tile"].addEventListener("click", function () { els["photo-input"].click(); });
  els["photo-input"].addEventListener("change", function () {
    var file = els["photo-input"].files[0];
    els["photo-input"].value = "";
    if (!file) return;
    setStatus(els["post-status"], "Processing photo…");
    resizeAndCompress(file).then(function (blob) {
      photoBlob = blob;
      renderPhotoTile();
      setStatus(els["post-status"], "");
    }).catch(function () {
      setStatus(els["post-status"], "Couldn't process that photo — try another.", "error");
    });
  });

  // ---------------- Composer mode (new post vs. editing an existing one) ----------------

  var composerMode = "new"; // "new" | "edit"
  var editing = null; // { path, sha, title, date, photo } of the entry being edited

  function renderTopbarActions() {
    var el = els["topbar-actions"];
    if (composerMode === "edit") {
      el.innerHTML = '<button class="link" id="cancel-edit-btn">Cancel</button>';
      document.getElementById("cancel-edit-btn").addEventListener("click", function () {
        resetComposerToNew();
        showScreen("list-screen");
      });
    } else {
      el.innerHTML = '<button class="link" id="my-posts-btn">My Posts</button>' +
        '<button class="link" id="logout-btn">Sign out</button>';
      document.getElementById("my-posts-btn").addEventListener("click", function () {
        showScreen("list-screen");
        loadList();
      });
      document.getElementById("logout-btn").addEventListener("click", function () {
        clearToken();
        showScreen("login-screen");
      });
    }
  }

  function enterComposer(mode, entry) {
    composerMode = mode;
    editing = entry || null;
    if (mode === "edit") {
      els["topbar-context"].innerHTML = "Editing <b>" + escapeHtml(entry.date || entry.path) + "</b>";
      els["body-text"].value = entry.body;
      existingPhotoPath = entry.photo || null;
      photoBlob = null;
      els["post-btn"].textContent = "Save Changes";
    } else {
      els["topbar-context"].innerHTML = "Posting as <b id=\"who-name\">" + escapeHtml(currentUserLogin || "") + "</b>";
      loadDraft();
      existingPhotoPath = null;
      photoBlob = null;
      els["post-btn"].textContent = "Post";
    }
    renderPhotoTile();
    renderTopbarActions();
    showScreen("composer-screen");
    autoGrow();
  }

  function resetComposerToNew() {
    composerMode = "new";
    editing = null;
    photoBlob = null;
    existingPhotoPath = null;
    els["body-text"].value = "";
    els["post-btn"].textContent = "Post";
  }

  els["new-post-btn"].addEventListener("click", function () {
    resetComposerToNew();
    enterComposer("new");
  });

  // ---------------- Draft persistence (new posts only — edits are short-lived) ----------------

  function saveDraft() { localStorage.setItem(DRAFT_KEY, els["body-text"].value); }
  function loadDraft() {
    var d = localStorage.getItem(DRAFT_KEY);
    if (d) els["body-text"].value = d;
  }
  function clearDraft() { localStorage.removeItem(DRAFT_KEY); }

  // Grows the textarea to fit whatever's been written — no length limit,
  // no internal scrollbar hiding the writing. Long-form is the point.
  function autoGrow() {
    var el = els["body-text"];
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
  }
  var draftTimer = null;
  els["body-text"].addEventListener("input", function () {
    autoGrow();
    if (composerMode === "new") {
      clearTimeout(draftTimer);
      draftTimer = setTimeout(saveDraft, 400);
    }
  });

  // ---------------- Posting ----------------

  function pad(n) { return String(n).padStart(2, "0"); }

  function localDateParts(d) {
    return { y: d.getFullYear(), m: pad(d.getMonth() + 1), day: pad(d.getDate()),
             hh: pad(d.getHours()), mm: pad(d.getMinutes()), ss: pad(d.getSeconds()) };
  }

  function blobToBase64(blob) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(reader.result.split(",")[1]); };
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  function contentsUrl(path) {
    return "/repos/" + GITHUB_OWNER + "/" + GITHUB_REPO + "/contents/" + path;
  }

  function fileExists(path) {
    return ghFetch(contentsUrl(path) + "?ref=" + GITHUB_BRANCH)
      .then(function (r) { return r.status === 200; });
  }

  function getFile(path) {
    return ghFetch(contentsUrl(path) + "?ref=" + GITHUB_BRANCH).then(function (r) {
      if (!r.ok) throw new Error("Couldn't load that file (GitHub API " + r.status + ").");
      return r.json();
    }).then(function (data) {
      return {
        sha: data.sha,
        content: decodeURIComponent(escape(atob(data.content.replace(/\n/g, ""))))
      };
    });
  }

  function putFile(path, contentB64, message, sha) {
    var body = { message: message, content: contentB64, branch: GITHUB_BRANCH };
    if (sha) body.sha = sha;
    return ghFetch(contentsUrl(path), {
      method: "PUT",
      body: JSON.stringify(body)
    }).then(function (r) {
      if (!r.ok) return r.json().then(function (b) { throw new Error(b.message || ("GitHub API error " + r.status)); });
      return r.json();
    });
  }

  function deleteFile(path, sha, message) {
    return ghFetch(contentsUrl(path), {
      method: "DELETE",
      body: JSON.stringify({ message: message, sha: sha, branch: GITHUB_BRANCH })
    }).then(function (r) {
      if (!r.ok) return r.json().then(function (b) { throw new Error(b.message || ("GitHub API error " + r.status)); });
      return r.json();
    });
  }

  function yamlEscape(str) {
    return '"' + String(str).replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"';
  }

  function escapeHtml(str) {
    var div = document.createElement("div");
    div.textContent = String(str == null ? "" : str);
    return div.innerHTML;
  }

  // Parses the simple front matter shape this whole system writes
  // (title/date/photo, then a markdown body) — not a general YAML parser.
  function parseReflectionMd(raw) {
    var m = /^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/.exec(raw);
    if (!m) return { title: "", date: "", photo: null, body: raw.trim() };
    var data = {};
    m[1].split(/\r?\n/).forEach(function (line) {
      var mm = /^([A-Za-z_]+):\s*(.*)$/.exec(line);
      if (!mm) return;
      var key = mm[1], val = mm[2].trim();
      if (val.length >= 2 && val[0] === '"' && val[val.length - 1] === '"') {
        val = val.slice(1, -1).replace(/\\"/g, '"').replace(/\\\\/g, "\\");
      }
      data[key] = val;
    });
    return { title: data.title || "", date: data.date || "", photo: data.photo || null, body: m[2].trim() };
  }

  // Uploads a new photo if one was picked, otherwise keeps whatever photo
  // path (if any) was already on the entry. Returns the path to write into
  // front matter ("/assets/images/x.jpg"), or null for no photo.
  function resolvePhotoPath(namePrefix) {
    if (photoBlob) {
      return blobToBase64(photoBlob).then(function (b64) {
        var now = new Date();
        var p = localDateParts(now);
        var photoPath = "assets/images/" + namePrefix + "-" + p.y + p.m + p.day + p.hh + p.mm + p.ss + ".jpg";
        return putFile(photoPath, b64, "Add photo for reflection " + p.y + "-" + p.m + "-" + p.day)
          .then(function () { return "/" + photoPath; });
      });
    }
    return Promise.resolve(existingPhotoPath || null);
  }

  function submitPost() {
    var text = els["body-text"].value.trim();
    if (!text) {
      setStatus(els["post-status"], "Write a few words before posting.", "error");
      return;
    }
    if (composerMode === "edit") { submitEdit(text); return; }

    els["post-btn"].disabled = true;
    els["post-btn"].innerHTML = '<span class="spinner"></span> Posting…';
    setStatus(els["post-status"], "");

    var now = new Date();
    var p = localDateParts(now);
    var dateStr = p.y + "-" + p.m + "-" + p.day;
    var titleStr = now.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });

    var mdPath = "_reflections/" + dateStr + ".md";

    fileExists(mdPath).then(function (exists) {
      // Same "-N" shape Decap's own same-day collision suffix uses.
      if (exists) mdPath = "_reflections/" + dateStr + "-" + p.hh + p.mm + ".md";

      return resolvePhotoPath("post").then(function (photoPath) {
        var frontMatter = "---\ntitle: " + yamlEscape(titleStr) + "\ndate: " + dateStr +
          (photoPath ? "\nphoto: " + photoPath : "") + "\n---\n" + text + "\n";
        var b64 = btoa(unescape(encodeURIComponent(frontMatter)));
        return putFile(mdPath, b64, "Post reflection: " + titleStr);
      });
    }).then(function () {
      clearDraft();
      photoBlob = null;
      els["body-text"].value = "";
      autoGrow();
      renderPhotoTile();
      // Link to the reflections index rather than guessing this post's
      // exact permalink — simpler and can't drift out of sync with
      // however Jekyll ends up slugifying the filename. Relative to
      // wherever this page is actually hosted (works the same on the
      // .github.io/bhantebo preview and later on bhantebo.com).
      var siteRoot = location.pathname.replace(/post\/?(index\.html)?$/, "");
      els["success-link"].href = location.origin + siteRoot + "reflections/";
      showScreen("success-screen");
    }).catch(function (err) {
      setStatus(els["post-status"], err.message || "Something went wrong — please try again.", "error");
    }).finally(function () {
      els["post-btn"].disabled = false;
      els["post-btn"].textContent = composerMode === "edit" ? "Save Changes" : "Post";
    });
  }

  function submitEdit(text) {
    els["post-btn"].disabled = true;
    els["post-btn"].innerHTML = '<span class="spinner"></span> Saving…';
    setStatus(els["post-status"], "");

    resolvePhotoPath("edit").then(function (photoPath) {
      var frontMatter = "---\ntitle: " + yamlEscape(editing.title) + "\ndate: " + editing.date +
        (photoPath ? "\nphoto: " + photoPath : "") + "\n---\n" + text + "\n";
      var b64 = btoa(unescape(encodeURIComponent(frontMatter)));
      return putFile(editing.path, b64, "Edit reflection: " + editing.path, editing.sha);
    }).then(function () {
      resetComposerToNew();
      showScreen("list-screen");
      loadList();
    }).catch(function (err) {
      setStatus(els["post-status"], err.message || "Something went wrong — please try again.", "error");
    }).finally(function () {
      els["post-btn"].disabled = false;
      els["post-btn"].textContent = composerMode === "edit" ? "Save Changes" : "Post";
    });
  }

  els["post-btn"].addEventListener("click", submitPost);
  els["post-another-btn"].addEventListener("click", function () {
    resetComposerToNew();
    enterComposer("new");
  });

  // ---------------- List / edit / delete ----------------

  var LIST_PAGE_SIZE = 25; // most-recent N — keeps this fast without pagination UI

  function loadList() {
    setStatus(els["list-status"], "Loading…");
    els["list-items"].innerHTML = "";

    ghFetch(contentsUrl("_reflections") + "?ref=" + GITHUB_BRANCH).then(function (r) {
      if (!r.ok) throw new Error("Couldn't load reflections (GitHub API " + r.status + ").");
      return r.json();
    }).then(function (entries) {
      var mdEntries = entries
        .filter(function (e) { return e.type === "file" && /\.md$/.test(e.name); })
        .sort(function (a, b) { return a.name < b.name ? 1 : -1; }) // newest filename first
        .slice(0, LIST_PAGE_SIZE);

      if (mdEntries.length === 0) {
        setStatus(els["list-status"], "No reflections yet.");
        return;
      }

      return Promise.all(mdEntries.map(function (e) {
        return getFile(e.path).then(function (file) {
          var parsed = parseReflectionMd(file.content);
          return { path: e.path, sha: file.sha, title: parsed.title, date: parsed.date,
                    photo: parsed.photo, body: parsed.body };
        }).catch(function () {
          return { path: e.path, sha: e.sha, title: e.name, date: "", photo: null, body: "" };
        });
      })).then(function (details) {
        setStatus(els["list-status"], "");
        renderList(details);
      });
    }).catch(function (err) {
      setStatus(els["list-status"], err.message || "Couldn't load reflections.", "error");
    });
  }

  function renderList(details) {
    var container = els["list-items"];
    container.innerHTML = "";
    details.forEach(function (entry) {
      var row = document.createElement("div");
      row.className = "list-row";

      var thumbHtml = entry.photo
        ? '<img class="thumb" src="' + rawUrl(entry.photo) + '" alt="">'
        : '<div class="thumb placeholder">📝</div>';

      row.innerHTML =
        thumbHtml +
        '<div class="info">' +
          '<div class="date">' + escapeHtml(entry.date || entry.title) + '</div>' +
          '<div class="snippet">' + escapeHtml(entry.body.slice(0, 80)) + '</div>' +
        '</div>' +
        '<button type="button" class="del-btn" aria-label="Delete">×</button>';

      row.addEventListener("click", function () {
        enterComposer("edit", entry);
      });
      row.querySelector(".del-btn").addEventListener("click", function (e) {
        e.stopPropagation();
        var label = entry.date || entry.title || entry.path;
        if (!confirm('Delete "' + label + '"? This can\'t be undone from here.')) return;
        row.style.opacity = "0.4";
        deleteFile(entry.path, entry.sha, "Delete reflection: " + entry.path).then(function () {
          row.remove();
        }).catch(function (err) {
          row.style.opacity = "1";
          alert(err.message || "Couldn't delete that post — please try again.");
        });
      });

      container.appendChild(row);
    });
  }

  // ---------------- Boot ----------------

  var currentUserLogin = "";

  function boot() {
    var token = getToken();
    if (!token) { showScreen("login-screen"); return; }
    whoAmI().then(function (user) {
      currentUserLogin = user.login;
      resetComposerToNew();
      enterComposer("new");
    }).catch(function () {
      clearToken();
      showScreen("login-screen");
    });
  }

  els["login-btn"].addEventListener("click", function () {
    els["login-btn"].disabled = true;
    setStatus(els["login-error"], "");
    login().then(function (token) {
      saveToken(token);
      els["login-btn"].disabled = false;
      boot();
    }).catch(function (err) {
      els["login-btn"].disabled = false;
      setStatus(els["login-error"], err.message, "error");
    });
  });

  boot();
})();
</script>
</body>
</html>
